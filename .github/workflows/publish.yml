# Publishes to npm when a push to main carries a package.json version that
# isn't on npm yet (pushes that don't bump the version are no-ops).
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. On npmjs.com,
# add a trusted publisher for this package: GitHub Actions, repository
# DarraghGeo/poker-bitvaljs, workflow file "publish.yml".
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish $NAME@$VERSION."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
